<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventSphere | Event Registration System</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1e1b4b, #0f172a 55%, #020617);
            color: #f8fafc;
            padding: 2rem 1.5rem;
        }

        .glow-orb {
            position: fixed;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            opacity: 0.45;
        }
        .orb-1 { top: -100px; left: -100px; background: #6366f1; }
        .orb-2 { bottom: -120px; right: -80px; background: #ec4899; }

        .container {
            max-width: 1180px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding-bottom: 1.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand h1 {
            font-size: 1.85rem;
            font-weight: 700;
            background: linear-gradient(90deg, #818cf8, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand p {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .api-badge {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(129, 140, 248, 0.35);
            color: #a5b4fc;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.85rem;
            text-decoration: none;
            transition: 0.2s;
        }
        .api-badge:hover {
            background: rgba(99, 102, 241, 0.3);
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 1.6fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .grid-layout { grid-template-columns: 1fr; }
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.55);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 1.75rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .event-list {
            display: grid;
            gap: 1.15rem;
        }

        .event-item {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 1.35rem;
            transition: transform 0.2s, border-color 0.2s;
        }
        .event-item:hover {
            transform: translateY(-3px);
            border-color: rgba(129, 140, 248, 0.45);
        }

        .event-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
        }

        .event-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: #fff;
        }

        .seats-pill {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.3);
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .event-desc {
            color: #cbd5e1;
            font-size: 0.92rem;
            margin: 0.65rem 0 1rem;
            line-height: 1.5;
        }

        .event-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.83rem;
            color: #94a3b8;
        }

        .form-stack {
            display: flex;
            flex-direction: column;
            gap: 1.75rem;
        }

        .form-group {
            margin-bottom: 0.9rem;
        }

        label {
            display: block;
            font-size: 0.82rem;
            color: #cbd5e1;
            margin-bottom: 0.35rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.7rem 0.9rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(15, 23, 42, 0.85);
            color: #f8fafc;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #818cf8;
        }

        button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            color: white;
            cursor: pointer;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            transition: opacity 0.2s, transform 0.15s;
        }

        button:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .toast {
            margin-top: 0.75rem;
            font-size: 0.85rem;
            padding: 0.6rem 0.85rem;
            border-radius: 8px;
            display: none;
        }
        .toast.success { display: block; background: rgba(16, 185, 129, 0.2); color: #6ee7b7; }
        .toast.error { display: block; background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
    </style>
</head>
<body>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="container">
        <header>
            <div class="brand">
                <h1>EventSphere</h1>
                <p>Seamless Event Discovery & Instant Seat Registration</p>
            </div>
            <a href="/api/events/" class="api-badge" target="_blank">Explore REST API &rarr;</a>
        </header>

        <div class="grid-layout">
            <!-- Left: Live Events Feed -->
            <div class="glass-card">
                <div class="section-title">Upcoming Events</div>
                <div id="eventsContainer" class="event-list">
                    <p style="color:#94a3b8;">Loading events...</p>
                </div>
            </div>

            <!-- Right: Forms -->
            <div class="form-stack">
                <!-- Register Attendee -->
                <div class="glass-card">
                    <div class="section-title">Register for an Event</div>
                    <form id="registerForm">
                        <div class="form-group">
                            <label>Select Event</label>
                            <select id="regEvent" required></select>
                        </div>
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" id="regName" placeholder="e.g., Ananya Rao" required>
                        </div>
                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email" id="regEmail" placeholder="ananya@example.com" required>
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="text" id="regPhone" placeholder="9876543210">
                        </div>
                        <button type="submit">Confirm Registration</button>
                        <div id="regToast" class="toast"></div>
                    </form>
                </div>

                <!-- Create New Event -->
                <div class="glass-card">
                    <div class="section-title">Host a New Event</div>
                    <form id="eventForm">
                        <div class="form-group">
                            <label>Event Title</label>
                            <input type="text" id="evTitle" placeholder="AI & Cloud Summit" required>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="evDesc" rows="2" placeholder="Hands-on developer workshop" required></textarea>
                        </div>
                        <div class="form-group">
                            <label>Date & Time</label>
                            <input type="datetime-local" id="evDate" required>
                        </div>
                        <div class="form-group">
                            <label>Location</label>
                            <input type="text" id="evLocation" placeholder="Main Auditorium" required>
                        </div>
                        <div class="form-group">
                            <label>Seat Capacity</label>
                            <input type="number" id="evCapacity" value="50" min="1" required>
                        </div>
                        <button type="submit">Publish Event</button>
                        <div id="evToast" class="toast"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function loadEvents() {
            const res = await fetch('/api/events/');
            const events = await res.json();
            const container = document.getElementById('eventsContainer');
            const select = document.getElementById('regEvent');

            if (!events.length) {
                container.innerHTML = '<p style="color:#94a3b8;">No events scheduled yet. Create one on the right!</p>';
                select.innerHTML = '<option value="">No events available</option>';
                return;
            }

            container.innerHTML = events.map(ev => `
                <div class="event-item">
                    <div class="event-header">
                        <div class="event-title">${ev.title}</div>
                        <span class="seats-pill">${ev.available_seats} / ${ev.capacity} seats left</span>
                    </div>
                    <p class="event-desc">${ev.description}</p>
                    <div class="event-meta">
                        <span>📍 ${ev.location}</span>
                        <span>🗓️ ${new Date(ev.date).toLocaleString()}</span>
                        <span>👥 ${ev.registered_count} registered</span>
                    </div>
                </div>
            `).join('');

            select.innerHTML = events.map(ev =>
                `<option value="${ev.id}">${ev.title} (${ev.available_seats} seats left)</option>`
            ).join('');
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const toast = document.getElementById('regToast');
            const payload = {
                event: parseInt(document.getElementById('regEvent').value),
                full_name: document.getElementById('regName').value,
                email: document.getElementById('regEmail').value,
                phone: document.getElementById('regPhone').value
            };

            const res = await fetch('/api/registrations/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok) {
                toast.className = 'toast success';
                toast.textContent = 'Registration confirmed!';
                e.target.reset();
                loadEvents();
            } else {
                toast.className = 'toast error';
                toast.textContent = Object.values(data).flat().join(' ');
            }
        });

        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const toast = document.getElementById('evToast');
            const payload = {
                title: document.getElementById('evTitle').value,
                description: document.getElementById('evDesc').value,
                date: new Date(document.getElementById('evDate').value).toISOString(),
                location: document.getElementById('evLocation').value,
                capacity: parseInt(document.getElementById('evCapacity').value)
            };

            const res = await fetch('/api/events/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                toast.className = 'toast success';
                toast.textContent = 'Event published successfully!';
                e.target.reset();
                loadEvents();
            } else {
                toast.className = 'toast error';
                toast.textContent = 'Could not create event. Check all fields.';
            }
        });

        loadEvents();
    </script>
</body>
</html>
